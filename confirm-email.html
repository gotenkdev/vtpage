<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xác nhận đổi email - VT Page</title>
  <meta name="theme-color" content="#E9EAEE">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-600-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/doto-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.VTFX)document.documentElement.classList.remove('js');},3500);</script>
</head>
<body class="page-auth">
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.6h.01"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.3" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1.3" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
  </svg>

  <header class="bar">
    <div class="wrap bar-inner">
      <a href="index.html" class="logo">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#FF5A1F"/>
          <g fill="#14161A">
            <circle cx="32" cy="14" r="4.1" opacity=".26"/>
            <circle cx="15" cy="14" r="4.6"/><circle cx="49" cy="14" r="4.6"/>
            <circle cx="23.5" cy="25.5" r="4.6"/><circle cx="40.5" cy="25.5" r="4.6"/>
            <circle cx="15" cy="37" r="4.1" opacity=".26"/><circle cx="49" cy="37" r="4.1" opacity=".26"/>
            <circle cx="23.5" cy="48.5" r="4.1" opacity=".26"/><circle cx="40.5" cy="48.5" r="4.1" opacity=".26"/>
          </g>
          <circle cx="32" cy="37" r="7" fill="#14161A"/>
          <circle class="mark-led" cx="32" cy="37" r="4.6" fill="#FFF3E3"/>
        </svg>
        <span>VT Page</span>
      </a>
      <div class="bar-end">
        <button type="button" class="motion-toggle" id="motionToggle" aria-label="Tạm dừng chuyển động" title="Tạm dừng chuyển động">
          <svg class="ic ic-pause"><use href="#i-pause"/></svg>
          <svg class="ic ic-play"><use href="#i-play"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="auth">
    <div class="wrap auth-grid">
      <section class="auth-plate" aria-labelledby="auth-title" style="grid-column: 1 / -1; max-width: 460px; margin-inline: auto;">
        <h1 class="auth-title" id="auth-title">Xác nhận đổi email</h1>
        <p class="auth-subtitle" id="authSubtitle">Đang xác nhận...</p>

        <p class="form-error" id="formError" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="formErrorText"></span></p>

        <div id="confirmDone" class="signup-done" hidden>
          <p class="auth-subtitle">Đã đổi email. Mọi thiết bị đang đăng nhập đều đã bị đăng xuất — hãy đăng nhập lại bằng email mới.</p>
          <p class="auth-switch"><a href="sign-in.html">Đăng nhập</a></p>
        </div>

        <p class="auth-switch" id="authSwitch"></p>
      </section>
    </div>
  </main>

  <script src="fx.js"></script>
  <script src="api.js"></script>
  <script src="auth.js?v=2"></script>
</body>
</html>
