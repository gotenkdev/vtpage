<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản trị - VT Page</title>
  <meta name="theme-color" content="#E9EAEE">
  <meta name="robots" content="noindex">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-600-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/doto-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css">
  <script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.VTFX)document.documentElement.classList.remove('js');},3500);</script>
</head>
<body class="page-auth">
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden">
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.6h.01"/></symbol>
    <symbol id="i-shield-lock" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5.5c0 4.6 3.1 8 7.5 9.5 4.4-1.5 7.5-4.9 7.5-9.5V6z"/><rect x="9" y="11" width="6" height="5" rx="1.2"/><path d="M10.3 11V9.6a1.7 1.7 0 0 1 3.4 0V11"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
  </svg>

  <header class="bar">
    <div class="wrap bar-inner">
      <a href="index.html" class="logo">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#FF5A1F"/>
          <g fill="#14161A">
            <circle cx="32" cy="14" r="4.1" opacity=".26"/>
            <circle cx="15" cy="14" r="4.6"/><circle cx="49" cy="14" r="4.6"/>
            <circle cx="23.5" cy="25.5" r="4.6"/><circle cx="40.5" cy="25.5" r="4.6"/>
            <circle cx="15" cy="37" r="4.1" opacity=".26"/><circle cx="49" cy="37" r="4.1" opacity=".26"/>
            <circle cx="23.5" cy="48.5" r="4.1" opacity=".26"/><circle cx="40.5" cy="48.5" r="4.1" opacity=".26"/>
          </g>
          <circle cx="32" cy="37" r="7" fill="#14161A"/>
          <circle class="mark-led" cx="32" cy="37" r="4.6" fill="#FFF3E3"/>
        </svg>
        <span>VT Page</span>
      </a>
      <div class="bar-end">
        <button type="button" class="motion-toggle" id="motionToggle" aria-label="Tạm dừng chuyển động" title="Tạm dừng chuyển động">
          <svg class="ic ic-pause"><use href="#i-pause"/></svg>
          <svg class="ic ic-play"><use href="#i-play"/></svg>
        </button>
        <div class="bar-actions" id="authButtons">
          <a href="sign-in.html" class="btn btn-ghost">Đăng nhập</a>
          <a href="sign-up.html" class="btn btn-outline">Đăng ký</a>
        </div>
      </div>
    </div>
  </header>

  <main class="settings">
    <div class="wrap">
      <section class="auth-plate settings-card" aria-labelledby="settings-title">
        <h1 class="auth-title" id="settings-title">Quản trị</h1>
        <p class="auth-subtitle" id="settingsSubtitle">Đang tải...</p>

        <div class="settings-skeleton" id="settingsSkeleton">
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
        </div>

        <!-- Không phải admin -->
        <div id="adminGate" hidden>
          <p class="auth-subtitle">Bạn không có quyền truy cập trang này.</p>
        </div>

        <div id="adminContent" hidden>
          <h2 class="section-heading">Hàng đợi duyệt tài khoản ngân hàng</h2>
          <div class="bank-list" id="queueList"></div>
          <p class="auth-subtitle" id="queueEmpty" hidden>Không có tài khoản nào đang chờ duyệt.</p>
          <p class="form-error" id="queueError" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="queueErrorText"></span></p>

          <h2 class="section-heading">Nhật ký kiểm toán</h2>
          <div class="settings-actions" style="margin-bottom: 14px;">
            <button type="button" class="btn btn-outline" id="verifyChainBtn">Kiểm tra tính toàn vẹn</button>
          </div>
          <p class="mfa-status" id="chainStatus" hidden><svg class="ic"><use href="#i-shield-lock"/></svg> <span id="chainStatusText"></span></p>
          <div class="bank-list" id="auditList"></div>
        </div>

        <!-- Ô xác minh lại (step-up) — mọi thao tác admin trên trang này cần -->
        <div id="stepUpPanel" class="step-up-panel" hidden>
          <p class="auth-subtitle">Cần xác minh lại để tiếp tục — nhập mã 2FA hiện tại:</p>
          <form class="mfa-form" id="stepUpForm">
            <div class="form-field">
              <input type="text" id="stepUpCode" inputmode="numeric" autocomplete="one-time-code" required>
            </div>
            <p class="form-error" id="stepUpError" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="stepUpErrorText"></span></p>
            <button type="submit" class="btn btn-primary btn-lg btn-submit">Xác nhận</button>
          </form>
        </div>

        <!-- Ô nhập lý do từ chối, dùng chung cho mọi mục trong hàng đợi -->
        <div id="rejectPanel" class="step-up-panel" hidden>
          <p class="auth-subtitle">Lý do từ chối (hiện cho chủ tài khoản):</p>
          <form class="mfa-form" id="rejectForm">
            <div class="form-field">
              <textarea id="rejectReason" maxlength="200" required></textarea>
            </div>
            <p class="form-error" id="rejectError" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="rejectErrorText"></span></p>
            <div class="settings-actions">
              <button type="submit" class="btn btn-ghost btn-lg btn-submit">Từ chối</button>
              <button type="button" class="btn btn-outline" id="rejectCancelBtn">Huỷ</button>
            </div>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="fx.js"></script>
  <script src="api.js"></script>
  <script src="auth.js"></script>
</body>
</html>
