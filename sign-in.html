<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng nhập - VT Page</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <a href="index.html" class="logo">VT Page</a>
  </header>

  <main class="auth-main">
    <div class="auth-card">
      <h1 class="auth-title">Sign in</h1>
      <p class="auth-subtitle">Chào mừng bạn quay lại VT Page.</p>

      <div class="federated-buttons">
        <button type="button" class="btn btn-federated">
          <span class="provider-mark">G</span>
          Continue with Google
        </button>
        <button type="button" class="btn btn-federated">
          <span class="provider-mark"></span>
          Continue with Apple
        </button>
      </div>

      <div class="divider">
        <span>or</span>
      </div>

      <form class="sign-in-form" data-mode="signin">
        <div class="form-field">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" autocomplete="username" required>
        </div>

        <div class="form-field">
          <label for="password">Password</label>
          <div class="password-field">
            <input type="password" id="password" name="password" autocomplete="current-password" required>
            <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
              <svg class="icon-eye" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <p class="form-error" id="formError" hidden></p>

        <button type="submit" class="btn btn-primary btn-submit">Sign in</button>
      </form>

      <p class="auth-switch">Chưa có tài khoản? <a href="sign-up.html">Sign up</a></p>
    </div>
  </main>

  <script src="auth.js"></script>
</body>
</html>
