  <header class="bar">
    <div class="wrap bar-inner">
      <a href="index.html" class="logo">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#FF5A1F"/>
          <g fill="#14161A">
            <circle cx="32" cy="14" r="4.1" opacity=".26"/>
            <circle cx="15" cy="14" r="4.6"/><circle cx="49" cy="14" r="4.6"/>
            <circle cx="23.5" cy="25.5" r="4.6"/><circle cx="40.5" cy="25.5" r="4.6"/>
            <circle cx="15" cy="37" r="4.1" opacity=".26"/><circle cx="49" cy="37" r="4.1" opacity=".26"/>
            <circle cx="23.5" cy="48.5" r="4.1" opacity=".26"/><circle cx="40.5" cy="48.5" r="4.1" opacity=".26"/>
          </g>
          <circle cx="32" cy="37" r="7" fill="#14161A"/>
          <circle class="mark-led" cx="32" cy="37" r="4.6" fill="#FFF3E3"/>
        </svg>
        <span>VT Page</span>
      </a>
      <div class="bar-end">
        <button type="button" class="motion-toggle" id="motionToggle" aria-label="Tạm dừng chuyển động" title="Tạm dừng chuyển động">
          <svg class="ic ic-pause"><use href="#i-pause"/></svg>
          <svg class="ic ic-play"><use href="#i-play"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="auth">
    <canvas class="hero-lattice" data-lattice aria-hidden="true"></canvas>
    <div class="wrap auth-grid">
      <div class="auth-stage">
        <div class="loa" id="loa" aria-hidden="true">
          <div class="loa-shell">
            <div class="loa-face">
              <canvas class="loa-grille" data-grille data-ox="0.985" data-oy="0.14"></canvas>
            </div>
            <div class="loa-panel">
              <span class="loa-led"></span>
              <div class="loa-display"><span class="led-digits">100.000</span></div>
              <div class="loa-keys">
                <span class="loa-key"><svg class="ic"><use href="#i-plus"/></svg></span>
                <span class="loa-key"><svg class="ic"><use href="#i-minus"/></svg></span>
                <span class="loa-key"><svg class="ic"><use href="#i-power"/></svg></span>
              </div>
              <div class="loa-plate">
                <svg class="qr" viewBox="0 0 21 21"><use href="#i-qr"/></svg>
                <span class="qr-scan"></span>
              </div>
            </div>
          </div>
          <div class="loa-feet"></div>
          <div class="loa-chip">
            <span class="chip-ico"><svg class="ic ic-fill"><use href="#i-heart"/></svg></span>
            <span class="chip-lines"><i></i><i></i></span>
            <span class="chip-amt">100.000</span>
          </div>
        </div>
      </div>

      <section class="auth-plate" aria-labelledby="auth-title">
        <h1 class="auth-title" id="auth-title">Sign in</h1>
        <p class="auth-subtitle" id="authSubtitle">Chào mừng bạn quay lại VT Page.</p>

        <div class="federated-buttons" id="federatedButtons" hidden>
          <button type="button" class="btn btn-federated" id="googleBtn">
            <svg class="ic-brand" viewBox="0 0 48 48" aria-hidden="true"><use href="#i-google"/></svg>
            Continue with Google
          </button>
        </div>

        <div class="divider" id="authDivider" hidden>
          <span>or</span>
        </div>

        <form class="sign-in-form" id="signinForm" data-mode="signin">
          <div class="form-field">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" autocomplete="username" required>
          </div>

          <div class="form-field">
            <label for="password">Password</label>
            <div class="password-field">
              <input type="password" id="password" name="password" autocomplete="current-password" required>
              <button type="button" class="password-toggle" aria-label="Show password" aria-pressed="false">
                <svg class="ic icon-eye"><use href="#i-eye"/></svg>
                <svg class="ic icon-eye-off"><use href="#i-eye-off"/></svg>
              </button>
            </div>
            <p class="forgot-link"><a href="forgot-password.html">Quên mật khẩu?</a></p>
          </div>

          <p class="form-error" id="formError" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="formErrorText"></span></p>

          <button type="submit" class="btn btn-primary btn-lg btn-submit">Sign in</button>
        </form>

        <form class="mfa-form" id="mfaForm" hidden>
          <div class="form-field">
            <label for="mfaCode">Mã xác thực (2FA)</label>
            <input type="text" id="mfaCode" name="code" inputmode="numeric" autocomplete="one-time-code" placeholder="123456 hoặc mã khôi phục" required>
          </div>

          <p class="form-error" id="mfaError" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="mfaErrorText"></span></p>

          <button type="submit" class="btn btn-primary btn-lg btn-submit">Xác nhận</button>
        </form>

        <p class="auth-switch" id="authSwitch">Chưa có tài khoản? <a href="sign-up.html">Sign up</a></p>
      </section>
    </div>
  </main>

  <script src="fx.js"></script>
  <script src="api.js"></script>
  <script src="auth.js?v=2"></script>
</body>
</html>
