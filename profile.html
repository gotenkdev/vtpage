<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hồ sơ - VT Page</title>
  <meta name="theme-color" content="#E9EAEE">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-600-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/doto-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css?v=5">
  <link rel="stylesheet" href="dashboard.css?v=3">
  <script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.VTFX)document.documentElement.classList.remove('js');},3500);</script>
</head>
<body class="page-auth" data-dash="profile">
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.3" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1.3" fill="currentColor"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.6h.01"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 8h3l2-2h6l2 2h3v11H4z"/><circle cx="12" cy="13.5" r="3.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16"/><path d="M9 7V4h6v3"/><path d="M6 7l1 13h10l1-13"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
  </svg>

  <header class="bar">
    <div class="wrap bar-inner">
      <a href="index.html" class="logo">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#FF5A1F"/>
          <g fill="#14161A">
            <circle cx="32" cy="14" r="4.1" opacity=".26"/>
            <circle cx="15" cy="14" r="4.6"/><circle cx="49" cy="14" r="4.6"/>
            <circle cx="23.5" cy="25.5" r="4.6"/><circle cx="40.5" cy="25.5" r="4.6"/>
            <circle cx="15" cy="37" r="4.1" opacity=".26"/><circle cx="49" cy="37" r="4.1" opacity=".26"/>
            <circle cx="23.5" cy="48.5" r="4.1" opacity=".26"/><circle cx="40.5" cy="48.5" r="4.1" opacity=".26"/>
          </g>
          <circle cx="32" cy="37" r="7" fill="#14161A"/>
          <circle class="mark-led" cx="32" cy="37" r="4.6" fill="#FFF3E3"/>
        </svg>
        <span>VT Page</span>
      </a>
      <div class="bar-end">
        <button type="button" class="motion-toggle" id="motionToggle" aria-label="Tạm dừng chuyển động" title="Tạm dừng chuyển động">
          <svg class="ic ic-pause"><use href="#i-pause"/></svg>
          <svg class="ic ic-play"><use href="#i-play"/></svg>
        </button>
        <div class="bar-actions" id="authButtons">
          <a href="sign-in.html" class="btn btn-ghost">Đăng nhập</a>
          <a href="sign-up.html" class="btn btn-outline">Đăng ký</a>
        </div>
      </div>
    </div>
  </header>

  <main class="settings">
    <div class="wrap">
      <section class="auth-plate settings-card" aria-labelledby="settings-title">
        <h1 class="auth-title" id="settings-title">Hồ sơ</h1>
        <p class="auth-subtitle" id="settingsSubtitle">Đang tải...</p>

        <div class="settings-skeleton" id="settingsSkeleton">
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
          <div class="skeleton-block"></div>
        </div>

        <form class="sign-in-form" id="createForm" hidden>
          <div class="form-field">
            <label for="username">Username</label>
            <input id="username" name="username" required minlength="3" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" autocomplete="off" autocapitalize="off" spellcheck="false">
            <p class="form-hint" id="usernameHint">vtpage.com/username — chữ, số, gạch dưới, 3-20 ký tự. Không đổi được sau khi tạo.</p>
          </div>

          <div class="form-field">
            <label for="displayName">Tên hiển thị</label>
            <input id="displayName" name="displayName" required maxlength="50">
          </div>

          <div class="form-field">
            <label for="bio">Giới thiệu (không bắt buộc)</label>
            <textarea id="bio" name="bio" maxlength="300"></textarea>
          </div>

          <p class="form-error" id="createError" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="createErrorText"></span></p>

          <button type="submit" class="btn btn-primary btn-lg btn-submit">Tạo hồ sơ</button>
        </form>

        <div id="editSection" hidden>
          <div class="avatar-row">
            <div class="avatar-wrap">
              <img class="avatar-preview" id="avatarPreview" alt="Ảnh đại diện" hidden>
              <div class="avatar-fallback" id="avatarFallback" aria-hidden="true"></div>
            </div>
            <div class="avatar-actions">
              <label class="btn btn-outline btn-sm" for="avatarInput">
                <svg class="ic"><use href="#i-camera"/></svg>
                Đổi ảnh
              </label>
              <input type="file" id="avatarInput" accept="image/png,image/jpeg,image/webp" hidden>
              <button type="button" class="btn btn-ghost btn-sm" id="avatarRemoveBtn">
                <svg class="ic"><use href="#i-trash"/></svg>
                Xoá ảnh
              </button>
            </div>
          </div>
          <p class="form-error" id="avatarError" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="avatarErrorText"></span></p>

          <p class="username-pill"><svg class="ic"><use href="#i-lock"/></svg><span id="usernameDisplay"></span></p>

          <form class="sign-in-form" id="editForm">
            <div class="form-field">
              <label for="editDisplayName">Tên hiển thị</label>
              <input id="editDisplayName" name="displayName" required maxlength="50">
            </div>

            <div class="form-field">
              <label for="editBio">Giới thiệu</label>
              <textarea id="editBio" name="bio" maxlength="300"></textarea>
            </div>

            <p class="form-error" id="editError" role="alert" hidden><svg class="ic"><use href="#i-alert"/></svg><span id="editErrorText"></span></p>
            <p class="form-hint is-good" id="editSaved" hidden>Đã lưu.</p>

            <button type="submit" class="btn btn-primary btn-lg btn-submit">Lưu thay đổi</button>
          </form>
        </div>
      </section>
    </div>
  </main>

  <script src="fx.js"></script>
  <script src="api.js"></script>
  <script src="auth.js?v=3"></script>
  <script src="dashboard.js?v=1"></script>
</body>
</html>
