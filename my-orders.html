<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <script src="i18n-app.js?v=4"></script>
  <script src="i18n.js?v=5"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng cá nhân - VT Pay</title>
  <meta name="theme-color" content="#E9EAEE">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="preload" href="fonts/bricolage-grotesque-latin-600-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="fonts/doto-latin-700.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="fonts.css">
  <link rel="stylesheet" href="style.css?v=26">
  <link rel="stylesheet" href="donate-settings.css?v=15">
  <link rel="stylesheet" href="dashboard.css?v=14">
  <script>document.documentElement.classList.add('js');setTimeout(function(){if(!window.VTFX)document.documentElement.classList.remove('js');},3500);</script>
</head>
<body class="page-auth" data-dash="myorders">
  <svg class="sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false" style="position:absolute;width:0;height:0;overflow:hidden"><symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.3" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1.3" fill="currentColor"/></symbol><symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5"/><path d="M12 16.6h.01"/></symbol>
    <symbol id="i-chat" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></symbol>
  </svg>

  <header class="bar">
    <div class="wrap bar-inner">
      <a href="/" class="logo">
        <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
          <rect width="64" height="64" rx="15" fill="#FF5A1F"/>
          <g fill="#14161A">
            <circle cx="32" cy="14" r="4.1" opacity=".26"/>
            <circle cx="15" cy="14" r="4.6"/><circle cx="49" cy="14" r="4.6"/>
            <circle cx="23.5" cy="25.5" r="4.6"/><circle cx="40.5" cy="25.5" r="4.6"/>
            <circle cx="15" cy="37" r="4.1" opacity=".26"/><circle cx="49" cy="37" r="4.1" opacity=".26"/>
            <circle cx="23.5" cy="48.5" r="4.1" opacity=".26"/><circle cx="40.5" cy="48.5" r="4.1" opacity=".26"/>
          </g>
          <circle cx="32" cy="37" r="7" fill="#14161A"/>
          <circle class="mark-led" cx="32" cy="37" r="4.6" fill="#FFF3E3"/>
        </svg>
        <span>VT Pay</span>
      </a>
      <div class="bar-end">
        <button type="button" class="motion-toggle" id="motionToggle" aria-label="Tạm dừng chuyển động" title="Tạm dừng chuyển động">
          <svg class="ic ic-pause"><use href="#i-pause"/></svg>
          <svg class="ic ic-play"><use href="#i-play"/></svg>
        </button>
        <div class="bar-actions" id="authButtons">
          <a href="/sign-in" class="btn btn-ghost">Đăng nhập</a>
          <a href="/sign-up" class="btn btn-outline">Đăng ký</a>
        </div>
      </div>
    </div>
  </header>

  <main class="settings">
    <div class="wrap">
      <section class="auth-plate settings-card" id="moLoading">
        <p class="auth-subtitle" id="settingsSubtitle">Đang tải...</p>
        <div class="settings-skeleton" id="settingsSkeleton"><div class="skeleton-block"></div><div class="skeleton-block"></div></div>
      </section>

      <div class="dh" id="myOrdersContent" hidden>
        <section class="pe-card dh-card" aria-labelledby="moTitle">
          <div class="dh-head"><h2 class="pe-h" id="moTitle">Đơn hàng cá nhân</h2><span class="dh-caption" id="moCount"></span></div>
          <div class="od-filters mo-filters">
            <div class="form-field dh-search"><label for="moSearch">Tìm kiếm</label><input id="moSearch" type="search" placeholder="Tên trang hoặc mã đơn hàng" autocomplete="off"></div>
            <div class="form-field"><label for="moStatus">Trạng thái</label><select id="moStatus"><option value="all">Tất cả</option><option value="pending">Chưa thanh toán</option><option value="paid">Đã thanh toán</option><option value="review">Đã thanh toán, cần đối soát</option><option value="expired">Hết hạn</option><option value="cancelled">Đã hủy</option></select></div>
            <div class="form-field"><label for="moSort">Sắp xếp</label><select id="moSort"><option value="time-desc">Thời gian ↓</option><option value="time-asc">Thời gian ↑</option><option value="amount-desc">Số tiền ↓</option><option value="amount-asc">Số tiền ↑</option><option value="status">Trạng thái</option></select></div>
            <button type="button" class="btn btn-outline" id="moRefresh">Làm mới</button>
          </div>
          <div class="dh-table" role="table" aria-label="Đơn hàng cá nhân">
            <div class="mo-tr dh-th" role="row"><span role="columnheader">Mã đơn hàng · Trang nhận</span><span role="columnheader">Thời gian</span><span role="columnheader">Loại đơn · Thanh toán</span><span role="columnheader" class="mo-num">Số tiền</span><span role="columnheader">Trạng thái</span><span role="columnheader" class="dh-act">Chi tiết</span></div>
            <div id="moList"></div>
          </div>
          <p class="pe-sub dh-empty" id="moEmpty" hidden>Chưa có đơn hàng nào khớp bộ lọc.</p>
          <div class="mo-pager" id="moPager" hidden>
            <span class="dh-caption" id="moPageInfo"></span>
            <div><button type="button" class="btn btn-outline btn-sm" id="moPrev">Trang trước</button> <button type="button" class="btn btn-outline btn-sm" id="moNext">Trang sau</button></div>
          </div>
        </section>

        <dialog class="vp-dialog od-dialog" id="moDialog" aria-labelledby="moDialogTitle">
          <div class="vp-dialog-head"><h2 class="pe-h" id="moDialogTitle">Chi tiết đơn hàng</h2><button type="button" class="btn btn-ghost btn-sm" id="moClose">Đóng</button></div>
          <div class="od-detail" id="moDetail"></div>
        </dialog>
      </div>
    </div>
  </main>

  <script src="fx.js"></script>
  <script src="api.js?v=14"></script>
  <script src="auth.js?v=34"></script>
  <script src="my-orders-page.js?v=1"></script>
  <script src="dashboard.js?v=13"></script>
  <script src="select-menu.js?v=1"></script>
</body>
</html>
